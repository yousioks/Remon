name: 🛡️ DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Поиск утечек секретов и API-ключей (Secret Scanning)
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: 🔑 Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # 2. Статический анализ безопасности (SAST - Semgrep)
  # ─────────────────────────────────────────────────────────────
  sast-scan:
    name: 🔎 Semgrep Full-Stack Security Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Rules
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/typescript" \
            --config "p/react" \
            --sarif \
            --output semgrep-results.sarif \
            || true

      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # 3. Анализ уязвимостей в файловой системе и образах (SCA - Trivy)
  # ─────────────────────────────────────────────────────────────
  trivy-scan:
    name: 📦 Trivy SCA & Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # 4. Проверка зависимостей Backend & Frontend
  # ─────────────────────────────────────────────────────────────
  audit-dependencies:
    name: 📋 NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm ci --ignore-scripts || npm install --package-lock-only
          npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts || npm install --package-lock-only
          npm audit --audit-level=high || true
